<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drawings — Sultan Al Ghafry</title>
    <meta
      name="description"
      content="Gallery of drawings by Sultan Al Ghafry."
    />
    <meta property="og:title" content="Drawings — Sultan Al Ghafry" />
    <meta
      property="og:description"
      content="Gallery of drawings by Sultan Al Ghafry."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#161310" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="drawings-site">
    <a class="skip-link" href="#content">Skip to gallery</a>

    <div class="page">
      <header class="site-header">
        <a class="mark" href="../" aria-label="Back to YOU">YOU</a>

        <nav class="nav" aria-label="Primary">
          <button
            class="nav-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="nav-menu"
          >
            Menu
          </button>
          <ul id="nav-menu" class="nav-list">
            <li><a href="../">Home</a></li>
            <li><a href="../#about">About</a></li>
            <li><a class="is-active" href="./" aria-current="page">Gallery</a></li>
            <li><a href="../#contact">Contact</a></li>
          </ul>
        </nav>

        <button
          class="theme-toggle"
          type="button"
          aria-label="Switch to light theme"
          title="Toggle color theme"
        >
          <span class="theme-toggle-icon" aria-hidden="true"></span>
        </button>
      </header>

      <main id="content">
        <section class="hero drawings-hero">
          <p class="eyebrow">Gallery</p>
          <h1>Drawings</h1>
          <p class="lede" data-gallery-lede>
            Drawings by Sultan Al Ghafry.
          </p>
        </section>

        <p class="owner-bar" data-owner-bar hidden>
          Adding is on for this device.
          <button type="button" class="owner-lock" data-owner-lock>
            Lock
          </button>
        </p>

        <p class="drawings-status" data-drawings-status hidden></p>
        <ul class="drawing-grid" data-drawing-grid></ul>
        <input
          class="visually-hidden"
          data-drawing-file
          type="file"
          accept="image/*"
          multiple
        />
      </main>

      <footer class="site-footer">
        <p>© <span id="year"></span> Sultan Al Ghafry</p>
        <p class="footer-note"><a href="../">Back to YOU</a></p>
      </footer>
    </div>

    <dialog class="drawing-dialog" data-drawing-dialog>
      <img alt="" data-drawing-preview />
      <button type="button" class="drawing-dialog-close" data-drawing-close>
        Close
      </button>
    </dialog>

    <script src="../script.js"></script>
    <script src="../drawings.js"></script>
  </body>
</html>
